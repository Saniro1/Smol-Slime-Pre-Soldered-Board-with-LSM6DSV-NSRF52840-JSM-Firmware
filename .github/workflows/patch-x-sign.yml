name: Build gyro direction UF2 variants

on:
  push:
    branches:
      - jsm-calibration
    paths:
      - "tools/patch_x_sign.py"
      - "tools/patch_both_signs.py"
      - "tools/patch_fix5.py"
      - "tools/patch_fix6.py"
      - "tools/patch_fix7.py"
      - ".github/workflows/patch-x-sign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-uf2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v4
        with:
          ref: jsm-calibration
          fetch-depth: 0

      - name: Generate and validate fix3
        run: |
          python3 tools/patch_x_sign.py \
            build/CURRENT_1_gyro-accel-fix2.UF2 \
            build/CURRENT_1_gyro-accel-fix3.UF2
          sha256sum build/CURRENT_1_gyro-accel-fix3.UF2

      - name: Preserve inverted build and generate fix4
        run: |
          python3 tools/patch_both_signs.py \
            build/CURRENT_1_gyro-accel-fix3.UF2 \
            build/CURRENT_1_gyro-accel-fix3-Inverted.UF2 \
            build/CURRENT_1_gyro-accel-fix4.UF2
          sha256sum build/CURRENT_1_gyro-accel-fix3-Inverted.UF2 build/CURRENT_1_gyro-accel-fix4.UF2

      - name: Generate X-only correction fix5
        run: |
          python3 tools/patch_fix5.py \
            build/CURRENT_1_gyro-accel-fix4.UF2 \
            build/CURRENT_1_gyro-accel-fix5.UF2
          sha256sum build/CURRENT_1_gyro-accel-fix5.UF2

      - name: Generate combined X/Y correction fix6
        run: |
          python3 tools/patch_fix6.py \
            build/CURRENT_1_gyro-accel-fix4.UF2 \
            build/CURRENT_1_gyro-accel-fix6.UF2
          sha256sum build/CURRENT_1_gyro-accel-fix6.UF2

      - name: Generate X/Z axis mapping candidate fix7
        run: |
          python3 tools/patch_fix7.py \\
            build/CURRENT_1_gyro-accel-fix6.UF2 \\
            build/CURRENT_1_gyro-accel-fix7.UF2
          sha256sum build/CURRENT_1_gyro-accel-fix7.UF2

      - name: Commit direction variants to calibration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/CURRENT_1_gyro-accel-fix3.UF2 build/CURRENT_1_gyro-accel-fix3-Inverted.UF2 build/CURRENT_1_gyro-accel-fix4.UF2 build/CURRENT_1_gyro-accel-fix5.UF2 build/CURRENT_1_gyro-accel-fix6.UF2 build/CURRENT_1_gyro-accel-fix7.UF2
          if git diff --cached --quiet; then
            echo "No new direction variants to commit."
          else
            git commit -m "build: add X/Z axis mapping candidate fix7"
            git push origin HEAD:jsm-calibration
          fi
