name: Build horizontal gyro X sign-corrected UF2

on:
  push:
    branches:
      - jsm-calibration
    paths:
      - "tools/patch_x_sign.py"
      - ".github/workflows/patch-x-sign.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-uf2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out calibration branch
        uses: actions/checkout@v4
        with:
          ref: jsm-calibration
          fetch-depth: 0

      - name: Generate and validate fix3
        run: |
          python3 tools/patch_x_sign.py \
            build/CURRENT_1_gyro-accel-fix2.UF2 \
            build/CURRENT_1_gyro-accel-fix3.UF2
          sha256sum build/CURRENT_1_gyro-accel-fix3.UF2

      - name: Commit fix3 to calibration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/CURRENT_1_gyro-accel-fix3.UF2
          if git diff --cached --quiet; then
            echo "No new fix3 changes to commit."
          else
            git commit -m "build: add horizontal gyro X sign-corrected fix3 UF2"
            git push origin HEAD:jsm-calibration
          fi
